<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Jahtumine</title>
    <script src="jahtumine.js"></script>
</head>
<body>
    <h2>Jahtumiskiiruse arvutamine</h2>

    <label>Välistemperatuur (°C):
        <input type="number" id="outside" value="10">
    </label><br><br>

    <label>Kannu algtemperatuur mõõtmisel (°C):
        <input type="number" id="start" value="20">
    </label><br><br>

    <label>Mõõdetud jahtumine 30 sekundiga (kraadi):
        <input type="number" id="delta" value="0.1">
    </label><br><br>

    <label>Päritav temperatuur (°C):
        <input type="number" id="query" value="60">
    </label><br><br>

    <button onclick="arvuta()">Arvuta</button>

    <h3>Jahtumine 30 sekundiga: <span id="result">-</span> kraadi</h3>
</body>
</html>
